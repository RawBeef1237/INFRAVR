# DXVK settings used by INFRA VR (INFRA\bin\infravr\dxvk.conf).
# The headset paces the game (SteamVR WaitGetPoses), so never wait for the monitor.
d3d9.presentInterval = 0
d3d9.maxFrameLatency = 1
d3d9.deviceLossOnFocusLoss = False
# If you have more than one GPU, put the name of the one the headset uses here:
# dxvk.deviceFilter = "NVIDIA GeForce RTX 3080"
