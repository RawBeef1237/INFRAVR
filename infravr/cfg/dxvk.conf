# DXVK settings used by INFRA VR (INFRA\infravr\cfg\dxvk.conf).
# The headset paces the game (SteamVR WaitGetPoses), so never wait for the monitor.
d3d9.presentInterval = 0
d3d9.maxFrameLatency = 1
d3d9.deviceLossOnFocusLoss = False
# If you have more than one GPU, put the name of the one the headset uses here:
# dxvk.deviceFilter = "NVIDIA GeForce RTX 3080"
# This DXVK is DXVK-GPLALL 2.6.1-6, the build L4D2VR uses. Shaders are compiled in the
# background (less stutter when something new appears); set False if new effects show up
# missing for a moment.
dxvk.enableAsync = True
# Frame pacing like stock DXVK: the headset already paces the game.
dxvk.framePace = "max-frame-latency"
# Keep textures where they are: the mod hands their Vulkan images to SteamVR, and DXVK's memory
# defragmentation replaces those images (a crash in the GPU driver after loading a save from
# another map). The mod sets this itself unless it is written here.
dxvk.enableMemoryDefrag = False
