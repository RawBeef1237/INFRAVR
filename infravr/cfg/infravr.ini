; INFRA VR settings. Lines starting with ; are comments. Restart INFRA after changes.

[vr]
; Game units per metre multiplier (1.0 = 39.37 units/m, Source's inch scale).
world_scale = 1.0
; Multiplies SteamVR's recommended per-eye resolution (lower = faster).
render_scale = 1.0
; Near clip plane in game units.
znear = 3
left_handed = false
; Show the left eye in the desktop window.
mirror_to_desktop = true
; true: the desktop window shows a 16:9 crop of the left eye that fills the window.
; false: the whole left eye, with black bars at the sides.
mirror_fill = true
; Antialiasing (MSAA) for the eye images: 0 = off, 2, 4 or 8 samples. Higher is smoother edges
; but costs GPU time. INFRA's own antialiasing setting only affects the desktop window.
antialiasing = 4
; OpenXR only: draw each eye with just its own field of view (an off-center view) instead of a
; wider symmetric one shared by both eyes. Same picture, about a third fewer pixels to draw.
offcenter_eyes = true
; INFRA's motion blur works out the blur from how far the view turned since the last frame; in VR
; that is the other eye, so it smears the whole picture (and leaves outlines off their objects).
; false turns it off (mat_motion_blur_enabled 0) on every level load.
motion_blur = false
; true = clear the eyes' stencil buffer whenever the game clears their depth buffer. INFRA never
; clears it, so the selection outline's mask piled up and hid the outline on small items.
clear_stencil = true
; Experimental: let INFRA render on a second CPU core (mat_queue_mode 2), like the game's
; "multicore rendering" option. Menus and level loads still use one core.
multicore = false
; VR runtime. openvr = SteamVR (also OpenXR-only headsets through OpenOpenVR / OpenComposite).
; openxr = the headset's own OpenXR runtime through the 64-bit helper in infravr\bin
; (experimental; falls back to openvr if it cannot start).
backend = openvr
; Make INFRA create its full-screen buffers at the eye size, so post-processing works in VR.
; If INFRA ever crashes while this runs it turns itself off (see infravr_skip.txt).
world_at_eye_size = true
; Only needed for unusual setups: hand every frame to SteamVR explicitly after Present.
explicit_handoff = false
; Which DXVK draws the game: stock = DXVK 2.7.1 (dxvk_d3d9.dll), gplall = DXVK-GPLALL 2.6.1, the
; build l4d2vr uses (dxvk_d3d9_gplall.dll). An earlier build used gplall and crashed at startup on one PC.
dxvk = stock
; overlay = HUD/subtitles on a floating panel, eyes = painted into both eyes like the flat game, off
hud_mode = overlay
hud_distance = 1.2
hud_width = 1.0
hud_down = 0.10
; Menus / loading screens are shown on a virtual screen (metres).
menu_distance = 2.2
menu_width = 2.4
; INFRA's full-screen effects (bloom, colour correction, vignette, depth of field). They stay
; off anyway unless world_at_eye_size worked (otherwise they smear into lines). false = always off.
post_processing = true
; true = render the eyes no larger than the game window: blurrier, but no effect can smear.
render_fit_window = false
; The in-game pause menu (the phone) on a screen in VR instead of the flat screen.
phone_menu = true
; INFRA's main menu is a live 3D scene. false = show it on the flat screen like other menus;
; true = show it in 3D with the menu on the phone screen in your hand.
main_menu_in_vr = false
phone_menu_width = 0.32
; false = the phone menu is a screen on the phone in your hand and moves with the controller;
; true = it stands in the world in front of you as a panel (metres) and the phone model is hidden.
phone_menu_in_world = false
; show the pointer beam in the phone menu (the right stick, A and B work it either way)
phone_menu_pointer = false
; true = in the phone menu the VR controllers act as an Xbox controller for INFRA (sticks are the
; sticks, A is A, B is B, triggers are triggers), so the menu works like with a real controller
phone_gamepad = true
phone_menu_world_width = 0.8
phone_menu_world_distance = 0.9

[movement]
snap_turn = true
snap_angle = 45
smooth_turn_speed = 150
; head or hand (off-hand controller) decides which way "forward" is
move_relative_to = head
; walk around your room; the player's body follows your head
roomscale = true
; Crouch in game when you crouch in real life (your head drops crouch_drop metres or more
; below your standing height; recenter while standing straight).
real_crouch = true
crouch_drop = 0.30
stick_deadzone = 0.15

[aim]
; Extra downward pitch (degrees) for pointing/using/grabbing with the controllers.
aim_pitch = 0
; "Use" (buttons, doors, keypads, picking things up) and INFRA's white selection outline go by
; where your hand points, starting at the hand. false = the older aim from your eyes.
hand_use = true
; A picked-up object moves into the hand that holds it and turns with it, and that hand is hidden
; while you hold it (like Half-Life 2: VR). Let go of the grip to drop it; it keeps your hand's
; swing, so letting go while swinging throws it. false = held in front of the hand.
hold_in_hand = true
; upright = a held object stands upright along the controller's up axis, keeps the way it faced
;           when you grabbed it, and turns with your hand
; hand = it keeps its whole rotation from when you grabbed it (even tipped over) and turns with your hand
; keep = it keeps that rotation in the world and does not turn when you turn your hand
hold_rotation = upright
; metres in front of the controller where the held object's grab point sits
hold_offset = 0.04
; squeeze the other hand's grip this close (metres) to a held object to pass it to that hand
handoff_radius = 0.30
; with your hand right at an object (touching it, not pointing), grabbing finds anything whose
; middle is this close (metres) to the hand
grab_reach = 0.35
; held physics objects pass through you instead of bumping into you
held_no_collide = true
; point with your index finger (other fingers closed) and touch an item with the fingertip to use
; it, like pressing a button. Doors and valves are left alone. Needs finger tracking (Index controllers).
pointer_touch = true
; metres from the fingertip to the item that counts as touching it
pointer_reach = 0.02
; where the fingertip is: metres in front of the controller, and above it
pointer_tip_forward = 0.10
pointer_tip_up = 0.0
; index finger curl (0 straight .. 1 curled) below this counts as pointing, the other fingers above
pointer_index_curl = 0.35
pointer_other_curl = 0.55
; the trigger also sends INFRA's "attack" (left mouse) when your hand is empty, for scripted
; screens that only listen for it, such as the slides in the office at the start of the game
trigger_attacks = true

[holsters]
enabled = true
; hips are at this fraction of your standing eye height (recenter while standing straight)
hip_height = 0.55
hip_side = 0.20
hip_forward = 0.02
hip_radius = 0.17
back_radius = 0.26
haptics = true
; physics objects are only carried while you hold the grip; letting go (or picking
; something up with the trigger) drops it
grip_to_carry = true
; true: taking the phone out of its hip holster (or the phone button) opens INFRA's phone menu in
; your hand; putting it back closes it. While it is open the right stick moves through the menu,
; A selects, B goes back, and the other buttons do nothing. false: the phone is just held.
phone_opens_menu = true

[camera]
; draw the camera's screen from its lens in your hand (an extra view of the scene)
screen_view = true
; redraw that view every Nth frame: 1 = every frame, 2 = half rate (cheaper)
screen_every = 2
; The camera model drawn in your hand: a glTF model with the hand that holds it, moved by INFRA's
; own camera animations (photos, changing the battery). Leave it empty for INFRA's camera model.
model = hands\camera_hand.glb
; Where the model's screen (left top right bottom) and lens (centre u v, radius) are in its
; texture, 0..1. The lens view is shown on the screen and taken from the lens.
screen_uv = 0.113 0.134 0.486 0.404
lens_uv = 0.891 0.716 0.044
screen_brightness = 1.0

[flashlight]
; The flashlight model drawn in your hand: a glTF model with the hand that holds it, moved by
; INFRA's own flashlight animations. Leave it empty for INFRA's flashlight model.
model = hands\flashlight_hand.glb

[phone]
; The phone model drawn in your hand in the phone menu and when INFRA takes the phone out (calls,
; texts): a glTF model with the hand that holds it, moved by INFRA's own phone animations. Leave
; it empty for INFRA's phone model.
model = hands\phone_hand.glb
; Where the model's screen is in its texture (left top right bottom, 0..1): the phone menu is
; shown there.
screen_uv = 0.041 0.133 0.480 0.879
; Shown on the phone instead of its own texture while INFRA puts its call screen on the phone.
call_texture = hands\phone_hand_call.png

[subtitles]
; INFRA's subtitles on a panel of their own, head-locked below your view, so they show in normal
; play and not only on the phone menu. Needs hud_mode = overlay and the OpenVR backend.
enabled = true
; panel width, distance in front of you and how far below eye level (metres): wider = bigger text
width = 1.0
distance = 1.4
down = 0.40
; the part of the screen cut out for the panel (left top right bottom, in HudLayout.res units:
; x from the screen centre, y from the top, the screen is 480 high). INFRA's subtitle box is
; -250 276 250 412.
region = -270 250 270 420
; how quickly faint pixels turn solid (text edges); 0..1 darkness behind the text (0 = none)
gain = 1.5
background = 0.0
; true = the phone menu screen shows the HUD (subtitles) as well, as it did before
on_phone = false
; true = also show the old full-screen HUD panel (vr.hud_width/...) in normal play
hud_panel = false

[viewmodel]
; Where the first-person model sits relative to the controller, in game units
; (forward, left, up in the controller's frame). Tweak these if the camera/phone
; does not line up with your hand.
offset_camera = -14 2 5
offset_phone = -12 3 4
offset_default = -12 2 4
; extra rotation of the model: pitch yaw roll (degrees)
angles = 0 0 0
; camera lens relative to the controller (forward, left, up) - the camera's screen and
; photos are taken from here
lens_offset = 3 0 1.5
flashlight_offset = 2 0 0

[hands]
; glb = the VR hand models in infravr\models\hands are drawn on both controllers and INFRA's arms are
; hidden (the camera, phone and flashlight still show). infra = INFRA's own arm models.
model = glb
left_model = hands\vr_hand_left.glb
right_model = hands\vr_hand_right.glb
; Placement of the right hand (the left is mirrored): metres right, up, back from the controller,
; then pitch yaw roll in degrees. scale 1 = the model's own size.
offset = 0.035 -0.02 -0.07
angles = 0 180 -90
scale = 1.0
; world = lit by the game's lights where your hands are, with the models' normal maps;
; simple = an even light from where you look (the old look). brightness multiplies either.
lighting = world
normal_maps = true
; which way the normal maps' green channel points: up (glTF) or down. Switch it if bumps look
; lit from below.
normal_map_green = up
brightness = 1.0
; hide the hands behind walls and props in front of them
depth_test = true
; draw the hands with INFRA's first-person models, so the game's post-processing (bloom, tone
; mapping, colour correction) applies to them; false = on top of the finished picture
post_processing = true
; bend the fingers from finger tracking (Index controllers) or the grip and trigger
fingers = true
; how far each finger joint bends at full curl (degrees)
curl_max = 75
; INFRA's arm models (model = infra): the camera, flashlight and phone models have both arms.
; With tracked = true the arm that is not holding the item follows your other controller.
tracked = true
; hide the upper arms, shoulders and body of the arm models, so only forearms and hands show
hide_upper_arm = true

[commands]
; Console commands the holsters/buttons run.
flashlight_press = +flashlight
flashlight_release = -flashlight
phone = use infra_phone
camera = use infra_camera
hands = use infra_hands
pause = gameui_activate

[debug]
log_input = false
; write what the headset images contain to infravr.log every few seconds (finds black-screen causes)
probe = true
; Mechanisms that crashed INFRA once are listed in infravr_skip.txt (in INFRA\infravr) and stay
; off. true = try them all again on the next start.
retry_skipped = false
